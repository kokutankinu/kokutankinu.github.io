<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>黑檀帛的小遊戲</title>
  <meta name="description" content="個人製作的小遊戲與 Windows 下載頁面">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap">
      <h1>黑檀帛的小遊戲</h1>
      <p>自己畫、自己做，慢慢增加中的小遊戲。</p>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2>遊戲</h2>

      <article class="game-card">
        <div class="thumb">
          <img src="pipoimg.png" alt="Pipo Desktop Pet" class="game-image">
        </div>
        <div class="info">
          <div class="title-row">
            <h3>Pipo Desktop Pet</h3>
            <span class="tag">開發中</span>
          </div>
          <p>
            Windows 桌面小寵物。Pipo 會在螢幕上走來走去，
            之後預計加入摸摸、抓起來、不同動作等功能。
          </p>
          <dl>
            <div><dt>平台</dt><dd>Windows</dd></div>
            <div><dt>版本</dt><dd>v0.1</dd></div>
            <div><dt>價格</dt><dd>免費</dd></div>
          </dl>
          <a class="button disabled" href="#" aria-disabled="true">尚未開放下載</a>
        </div>
      </article>
    </section>

    <section class="about">
      <h2>關於</h2>
      <p>這裡會放我和 ChatGPT 一起製作的小遊戲。完成後會在各遊戲頁提供下載與更新資訊。</p>
    </section>
  </main>

  <footer>
    <div class="wrap">© 2026 黑檀帛的小遊戲</div>
  </footer>
</body>
</html>
